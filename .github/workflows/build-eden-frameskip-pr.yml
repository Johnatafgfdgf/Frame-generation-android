name: Build Eden Frame Skip APK

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android build packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.31.6"

      - name: Clone Eden
        shell: bash
        run: |
          git clone --recursive --shallow-submodules --depth 1 https://github.com/UzuCore/eden.git eden

      - name: Apply Frame Skip
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          root = Path("eden")

          def r1(path, old, new):
              p = root / path
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f"pattern not found in {path}: {old[:100]!r}")
              p.write_text(s.replace(old, new, 1))

          r1(
              "src/common/settings.h",
              '''    SwitchableSetting<bool> frame_gen{linkage, false, "frame_gen", Category::Renderer,
                                      Specialization::Default, true, false};''',
              '''    SwitchableSetting<u32, true> frame_skip{linkage,
                                            0,
                                            0,
                                            240,
                                            "frame_skip",
                                            Category::Renderer,
                                            Specialization::Countable,
                                            true,
                                            true};

    SwitchableSetting<bool> frame_gen{linkage, false, "frame_gen", Category::Renderer,
                                      Specialization::Default, true, false};'''
          )

          r1(
              "src/android/app/src/main/java/org/yuzu/yuzu_emu/features/settings/model/IntSetting.kt",
              '''    RENDERER_RESOLUTION("resolution_setup"),
    RENDERER_FRAME_GEN_MULTIPLIER("frame_gen_multiplier"),''',
              '''    RENDERER_RESOLUTION("resolution_setup"),
    RENDERER_FRAME_SKIP("frame_skip"),
    RENDERER_FRAME_GEN_MULTIPLIER("frame_gen_multiplier"),'''
          )

          r1(
              "src/android/app/src/main/res/values/strings.xml",
              '''    <string name="frame_gen">Frame generation</string>''',
              '''    <string name="frame_skip">Frame Skip</string>
    <string name="frame_gen">Frame generation</string>'''
          )

          r1(
              "src/android/app/src/main/java/org/yuzu/yuzu_emu/fragments/EmulationFragment.kt",
              '''            quickSettings.addBooleanSetting(
                R.string.use_docked_mode,
                container,
                BooleanSetting.USE_DOCKED_MODE,
            )

            quickSettings.addDivider(container)''',
              '''            quickSettings.addBooleanSetting(
                R.string.use_docked_mode,
                container,
                BooleanSetting.USE_DOCKED_MODE,
            )

            quickSettings.addSliderSetting(
                R.string.frame_skip,
                container,
                IntSetting.RENDERER_FRAME_SKIP,
                minValue = 0,
                maxValue = 240,
                units = " fps"
            )

            quickSettings.addDivider(container)'''
          )

          r1(
              "src/video_core/renderer_vulkan/renderer_vulkan.h",
              '''#include <memory>''',
              '''#include <chrono>
#include <memory>'''
          )

          r1(
              "src/video_core/renderer_vulkan/renderer_vulkan.h",
              '''    void EndSingleTimeCommands(VkCommandBuffer command_buffer);
    void Report() const;''',
              '''    void EndSingleTimeCommands(VkCommandBuffer command_buffer);
    bool ShouldSkipPresentFrame();
    void Report() const;'''
          )

          r1(
              "src/video_core/renderer_vulkan/renderer_vulkan.h",
              '''    std::optional<TurboMode> turbo_mode;

    Frame applet_frame;''',
              '''    std::optional<TurboMode> turbo_mode;

    std::chrono::steady_clock::time_point frame_skip_last_sample{};
    std::chrono::steady_clock::time_point frame_skip_last_present{};
    double frame_skip_budget{};

    Frame applet_frame;'''
          )

          cpp = root / "src/video_core/renderer_vulkan/renderer_vulkan.cpp"
          s = cpp.read_text()
          marker = '''void RendererVulkan::Composite(std::span<const Tegra::FramebufferConfig> framebuffers) {'''
          if marker not in s:
              raise SystemExit("Composite marker not found")
          impl = r'''bool RendererVulkan::ShouldSkipPresentFrame() {
    using Clock = std::chrono::steady_clock;

    const u32 requested_skips = Settings::values.frame_skip.GetValue();
    if (requested_skips == 0) {
        frame_skip_last_sample = {};
        frame_skip_last_present = {};
        frame_skip_budget = 0.0;
        return false;
    }

    const auto now = Clock::now();
    if (frame_skip_last_sample.time_since_epoch().count() == 0) {
        frame_skip_last_sample = now;
        frame_skip_last_present = now;
        frame_skip_budget = 0.0;
        return false;
    }

    double elapsed = std::chrono::duration<double>(now - frame_skip_last_sample).count();
    elapsed = std::clamp(elapsed, 0.0, 0.25);
    frame_skip_last_sample = now;

    frame_skip_budget = std::min(frame_skip_budget + elapsed * requested_skips, 2.0);

    const bool keepalive_due =
        (now - frame_skip_last_present) >= std::chrono::seconds{1};

    if (frame_skip_budget >= 1.0 && !keepalive_due) {
        frame_skip_budget -= 1.0;
        return true;
    }

    frame_skip_last_present = now;
    return false;
}

void RendererVulkan::Composite(std::span<const Tegra::FramebufferConfig> framebuffers) {
    if (ShouldSkipPresentFrame()) {
        gpu.RendererFrameEndNotify();
        rasterizer.TickFrame();
        return;
    }
'''
          cpp.write_text(s.replace(marker, impl, 1))
          print("Frame Skip patch applied")
          PY

      - name: Ensure signing key
        shell: bash
        run: |
          KEYSTORE="eden/src/android/app/debug.keystore"
          if [ ! -f "$KEYSTORE" ]; then
            keytool -genkeypair -v -keystore "$KEYSTORE" -storepass android               -alias androiddebugkey -keypass android               -dname "CN=Android Debug,O=Android,C=US"               -keyalg RSA -keysize 2048 -validity 10000
          fi

      - name: Build Optimized Nightly
        shell: bash
        working-directory: eden/src/android
        run: |
          chmod +x gradlew
          ./gradlew assembleGenshinSpoofRelease             -Pnightly=true             -Dorg.gradle.jvmargs="-Xmx6g -Dfile.encoding=UTF-8"             --stacktrace

      - name: Stage APK
        shell: bash
        run: |
          APK="eden/src/android/app/build/outputs/apk/genshinSpoof/release/app-genshinSpoof-release.apk"
          test -f "$APK"
          cp "$APK" Eden_Optimized_Nightly_FrameSkip.apk
          ls -lh Eden_Optimized_Nightly_FrameSkip.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Eden-Optimized-Nightly-FrameSkip
          path: Eden_Optimized_Nightly_FrameSkip.apk
          if-no-files-found: error
          retention-days: 3
