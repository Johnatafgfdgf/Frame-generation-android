name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install Android native toolchain
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER"             "platforms;android-35"             "build-tools;35.0.0"             "ndk;30.0.16248370"             "cmake;3.22.1"

      - name: Show pinned LSFG revision
        run: |
          git submodule status --recursive
          test -f third_party/lsfg-vk-android/framegen/CMakeLists.txt
          test -f third_party/lsfg-vk-android/thirdparty/volk/volk.c

      - name: Build debug APK
        run: gradle --stacktrace :app:assembleDebug

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frame-generation-android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
